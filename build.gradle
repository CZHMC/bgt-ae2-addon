plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories.clear()
repositories {
    maven {url = "https://libraries.minecraft.net/"}
    maven {url = "https://neoforged.forgecdn.net/releases"}
    maven {url = "https://neoforged.forgecdn.net/mojang-meta"}
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://maven.blamejared.com" }//jei

    mavenCentral()
    mavenLocal()
}

dependencies {
    //jei
    compileOnly("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")
    runtimeOnly("mezz.jei:jei-$minecraft_version-neoforge:$jei_version")
    // AE2
    compileOnly "org.appliedenergistics:appliedenergistics2:${project.ae2_api_version}:api"
    compileOnly "curse.maven:applied-energistics-2-223794:7027323"
    runtimeOnly "curse.maven:applied-energistics-2-223794:7027323"
    runtimeOnly "org.appliedenergistics:guideme:${project.guideme_version}"
    // Building Gadgets 2
    compileOnly "curse.maven:bgt-298187:6850515"
    runtimeOnly "curse.maven:bgt-298187:6850515"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly "org.appliedenergistics:appliedenergistics2:${project.ae2_api_version}:api"
    testCompileOnly "curse.maven:bgt-298187:6850515"
    testCompileOnly "net.neoforged:neoforge:${neo_version}"
    testRuntimeOnly "net.neoforged:neoforge:${neo_version}"


}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ae2_version_range      : ae2_version_range,
            bgt_version_range      : bgt_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
